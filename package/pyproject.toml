[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crosshost-benchmark"
version = "1.0.0"
description = "A benchmark for predicting bacterial regulatory DNA activity across host species"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gabriel" }]
keywords = ["genomics", "benchmark", "regulatory-dna", "bacteria", "cross-host", "machine-learning"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.3",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "pyarrow==24.0.0",
  "matplotlib==3.11.0",
  "openpyxl==3.1.5",  # pandas' optional Excel engine, needed by
                       # scripts/88_parse_drafts.py (part of the core
                       # `make reproduce` path since Gate 11) -- pandas
                       # imports it lazily inside read_excel(), so it never
                       # appears as a top-level `import openpyxl` anywhere
                       # and was missed by a plain import-statement grep;
                       # found only by genuinely running `make reproduce`
                       # in a fresh clone with nothing preinstalled (Gate 14)
]

[project.optional-dependencies]
models = ["torch==2.13.0", "transformers==5.14.1", "einops"]
dev = ["pytest>=8.0"]
citations = ["certifi"]  # needed only for scripts/97_verify_citations.py
                          # (make verify-citations) -- a live-network check
                          # against CrossRef/arXiv; certifi provides a CA
                          # bundle for Python installs whose SSL context
                          # cannot otherwise verify HTTPS certificates (a
                          # real, silent gap on some macOS Python.org
                          # installs -- confirmed missing in a genuinely
                          # fresh clone/venv, Gate 14; masked entirely on
                          # the original dev machine, where certifi happened
                          # to already be present from an unrelated install)

[project.urls]
Repository = "https://github.com/gabeykim/crosshost"

[tool.setuptools.packages.find]
include = ["crosshost*"]
