[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crosshost-benchmark"
version = "1.0.0"
description = "A benchmark for predicting bacterial regulatory DNA activity across host species"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gabriel" }]
keywords = ["genomics", "benchmark", "regulatory-dna", "bacteria", "cross-host", "machine-learning"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.3",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "pyarrow==24.0.0",
  "matplotlib==3.11.0",
]

[project.optional-dependencies]
models = ["torch==2.13.0", "transformers==5.14.1", "einops"]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/PLACEHOLDER/crosshost-benchmark"

[tool.setuptools.packages.find]
include = ["crosshost*"]
